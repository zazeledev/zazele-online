<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zazele Online QA Validation Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --border: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      line-height: 1.5;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 2.2rem; margin-bottom: 8px; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header .meta { color: var(--text-muted); font-size: 0.95rem; }
    .overall-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .overall-status { font-size: 1.5rem; font-weight: 600; }
    .overall-status.pass { color: var(--success); }
    .overall-status.fail { color: var(--danger); }
    .stat-box h4 { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; margin-bottom: 6px; }
    .stat-box p { font-size: 1.8rem; font-weight: 700; }
    .suites-grid { display: grid; grid-template-columns: 1fr; gap: 30px; }
    @media (min-width: 768px) {
      .suites-grid { grid-template-columns: 1fr 1fr; }
    }
    .suite-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .suite-card.suite-pass { border-top: 4px solid var(--success); }
    .suite-card.suite-fail { border-top: 4px solid var(--danger); }
    .suite-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .suite-header h3 { font-size: 1.2rem; font-weight: 600; }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .bg-success { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
    .bg-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .suite-stats { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    .test-list { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
    .test-item {
      padding: 10px 12px;
      border-radius: 8px;
      background-color: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.02);
    }
    .test-item.pass { border-left: 3px solid var(--success); }
    .test-item.fail { border-left: 3px solid var(--danger); background-color: rgba(239, 68, 68, 0.03); }
    .test-name { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .test-item.pass .icon { color: var(--success); font-weight: bold; }
    .test-item.fail .icon { color: var(--danger); font-weight: bold; }
    .test-error {
      margin-top: 6px;
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #fca5a5;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Zazele Online QA Report</h1>
      <div class="meta">Ran at 10/15/2026, 8:41:34 PM | Environment: Test/Local-Mock</div>
    </header>
    
    <div class="overall-card">
      <div>
        <div class="overall-status fail">
          ✗ TEST RUN FAILED
        </div>
      </div>
      <div class="stat-box">
        <h4>Passed</h4>
        <p style="color: var(--success);">0</p>
      </div>
      <div class="stat-box">
        <h4>Failed</h4>
        <p style="color: var(--danger);">1</p>
      </div>
    </div>
    
    <div class="suites-grid">
      
      <div class="suite-card suite-fail">
        <div class="suite-header">
          <h3>E2E</h3>
          <span class="badge bg-danger">FAIL</span>
        </div>
        <div class="suite-stats">0 Passed / 1 Failed</div>
        <div class="test-list">
          
            <div class="test-item fail">
              <div class="test-name">
                <span class="icon">✗</span>
                <span>E2E: Portal, student and admin workspaces across viewports and themes</span>
              </div>
              <div class="test-error">Waiting for selector `#admin-page.active` failed</div>
            </div>
          
        </div>
      </div>
    
    </div>
  </div>
</body>
</html>
